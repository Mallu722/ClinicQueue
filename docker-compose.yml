services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinicqueue-api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinicqueue-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
