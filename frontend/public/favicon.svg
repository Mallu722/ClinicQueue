<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0D9488" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded Medical Shield Base -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#medGrad)" filter="url(#glow)"/>
  
  <!-- Symmetrical Medical Cross with Heartbeat Inlay -->
  <rect x="21" y="11" width="6" height="26" rx="3" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="11" y="21" width="26" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.95"/>
  
  <!-- Dynamic Pulse/ECG Overlay Line -->
  <path d="M12 24 L18 24 L21 16 L25 32 L28 22 L31 25 L36 24" 
        stroke="#042F2E" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
